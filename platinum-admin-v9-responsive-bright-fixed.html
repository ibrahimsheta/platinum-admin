async function adminWrite(action,payload={}){

  if(!session) throw new Error("Session expired. Please sign in again.");

/* ===== GPS V5: single source of truth ===== */
let fleetGpsTimer=null, fleetTrack=null, fleetStreetLayer=null, fleetSatelliteLayer=null, fleetBaseControl=null;
function gpsRowsForVehicle(rows, vehicleId){
  return (rows||[]).filter(x=>x.vehicle_id===vehicleId && Number.isFinite(+x.latitude) && Number.isFinite(+x.longitude) && Number.isFinite(+x.accuracy_m) && +x.accuracy_m<=100)
    .sort((a,b)=>new Date(a.captured_at)-new Date(b.captured_at));
}
function latestGpsByVehicle(rows){
  const out={};
  (D.veh||[]).forEach(v=>{const a=gpsRowsForVehicle(rows,v.id); if(a.length)out[v.id]=a[a.length-1];});
  return out;
}
function vehicleIcon(state,heading){
  const bg=state==='live'?'#35e0cf':state==='stop'?'#f0b44c':'#73828a';
  const rot=Number.isFinite(+heading)?+heading:0;
  return L.divIcon({className:'fleetMarker',html:'<div style="transform:rotate('+rot+'deg);width:22px;height:22px;position:relative"><div style="position:absolute;left:7px;top:1px;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:10px solid '+bg+'"></div><div style="position:absolute;left:3px;top:7px;width:16px;height:12px;border-radius:50%;background:'+bg+';border:3px solid #07121c;box-shadow:0 0 14px '+bg+'99"></div></div>',iconSize:[22,22],iconAnchor:[11,11]});
}
function renderFleetMap(){
  const el=document.getElementById('fleetMap'); if(!el || typeof L==='undefined')return;
  if(!fleetMap){
    fleetMap=L.map(el,{zoomControl:true,attributionControl:true}).setView([30.0444,31.2357],6);
    fleetStreetLayer=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
    fleetSatelliteLayer=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'});
    fleetStreetLayer.addTo(fleetMap);
    fleetBaseControl=L.control.layers({'Street Map':fleetStreetLayer,'Satellite':fleetSatelliteLayer},null,{position:'topright',collapsed:false}).addTo(fleetMap);
  }
  const latest=latestGpsByVehicle(D.loc||[]), points=[], seen={};
  const trackPoints=[];
  (D.veh||[]).forEach(v=>{
    const x=latest[v.id]; if(!x)return; seen[v.id]=true;
    const lat=+x.latitude,lng=+x.longitude; if(!Number.isFinite(lat)||!Number.isFinite(lng))return;
    const age=Math.max(0,(Date.now()-new Date(x.captured_at).getTime())/60000), moving=Number(x.speed_kmh||0)>5;
    const state=age<=3?(moving?'Moving':'Stopped'):'Offline',cls=age<=3?(moving?'live':'stop'):'off';
    const dr=(D.drv||[]).find(d=>d.id===x.driver_id),tr=(D.trips||[]).find(t=>t.id===x.trip_id);
    const html='<div style="min-width:220px;direction:ltr;text-align:left"><b>🚗 '+E(v.vehicle_code)+'</b><br>Driver: '+E(dr?.name||'—')+'<br>Trip: '+E(tr?.trip_code||'—')+'<br>Speed: '+(x.speed_kmh==null?'—':n(x.speed_kmh,1))+' km/h<br>Accuracy: '+n(x.accuracy_m,0)+' m<br>Last update: '+ft(x.captured_at)+'<br><b>Status: '+state+'</b></div>';
    let m=fleetMarkers.find(z=>z._vehicleId===v.id);
    if(!m){m=L.marker([lat,lng],{icon:vehicleIcon(cls,x.heading)}).addTo(fleetMap);m._vehicleId=v.id;fleetMarkers.push(m);} else {m.setLatLng([lat,lng]);m.setIcon(vehicleIcon(cls,x.heading));}
    m.bindPopup(html); points.push([lat,lng]);
    gpsRowsForVehicle(D.loc||[],v.id).slice(-30).forEach(p=>trackPoints.push([+p.latitude,+p.longitude]));
  });
  fleetMarkers=fleetMarkers.filter(m=>{if(!seen[m._vehicleId]){try{fleetMap.removeLayer(m)}catch(_){}return false}return true});
  if(fleetTrack){try{fleetMap.removeLayer(fleetTrack)}catch(_){}fleetTrack=null;}
  if(trackPoints.length>1)fleetTrack=L.polyline(trackPoints,{weight:4,opacity:.75}).addTo(fleetMap);
  if(points.length && !fleetMap._fleetInitialFit){fleetMap.setView(points[0],15);fleetMap._fleetInitialFit=true;}
  const lbl=document.getElementById('fleetLiveLabel'); if(lbl)lbl.textContent=(points.length?points.length:'0')+' vehicles • LIVE GPS';
}

  try{

}

    <div class="card"><h3>Latest Alerts</h3>${(D.exc||[]).slice(0,4).map(e=>`<div class="alertRow"><span class="dot ${/CRIT|HIGH/i.test(e.severity)?'red':''}"></span><b>${E(e.exception_type||'Exception')}</b><div class="lb">${E(e.description||'')}</div></div>`).join('')||'<div class="msg">No alerts</div>'}</div>
   </div>
  </div>
  <div class="v7bottom"><div class="card"><h3>Recent Trips</h3>${tbl(tripCols(),recent,tAttr)}</div><div class="card"><h3>Operating Cost Analysis</h3><div class="miniStat"><span>Fuel Cost</span><strong>EGP ${n(C,2)}</strong></div><div class="miniStat"><span>Toll Fees</span><strong class="blue">EGP ${n(toll,2)}</strong></div><div class="miniStat"><span>Total Operating Cost</span><strong class="accent">EGP ${n(C+toll,2)}</strong></div><div class="miniStat"><span>Average Fuel</span><strong>${km?n(L/km*100,1):'—'} L/100km</strong></div></div></div>`;
}
